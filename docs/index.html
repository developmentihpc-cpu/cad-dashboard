.ov-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 4px; }
.activity-text { font-size: 12px; color: var(--text); flex: 1; line-height: 1.5; }
.activity-time { font-size: 10px; color: var(--text4); white-space: nowrap; flex-shrink: 0; }
.ov-sector-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ov-sector-label { font-size: 11px; color: var(--text2); width: 150px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-sector-bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.ov-sector-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.ov-sector-count { font-size: 11px; font-weight: 700; color: var(--accent); width: 20px; text-align: right; flex-shrink: 0; }

/* ── Feature 8: Pipeline Trend chart ── */
.trend-chart { display: flex; align-items: flex-end; gap: 5px; height: 80px; padding: 0 4px; margin-top: 10px; }
.trend-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.trend-bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 3px; transition: opacity .15s; }
.trend-bar:hover { opacity: .75; }
.trend-label { font-size: 9px; color: var(--text4); white-space: nowrap; }
.trend-count { font-size: 9px; font-weight: 700; color: var(--accent); }

/* ── Feature 2: Edit panel ── */
.proj-edit-panel { background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 16px 20px; margin: 0 20px 16px; }
.proj-edit-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.proj-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.proj-edit-field { display: flex; flex-direction: column; gap: 4px; }
.proj-edit-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .4px; }
.proj-edit-input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 12px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
.proj-edit-input:focus { border-color: var(--accent); background: var(--surface); }
.proj-edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
.proj-edit-save { padding: 7px 16px; background: var(--accent); color: #fff; border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; }
.proj-edit-save:hover { opacity: .88; }
.proj-edit-cancel { padding: 7px 14px; background: transparent; color: var(--text3); border: 1px solid var(--border); border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
.proj-edit-cancel:hover { border-color: var(--text3); color: var(--text); }

/* ── Feature 3: Change history ── */
.history-section { padding: 14px 20px; border-top: 1px solid var(--border); }
.history-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--text2); padding: 0; text-transform: uppercase; letter-spacing: .5px; }
.history-toggle svg { transition: transform .2s; }
.history-toggle.open svg { transform: rotate(90deg); }
.history-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.history-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; background: var(--bg); border-radius: 7px; font-size: 11px; }
.history-icon { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-lt); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 9px; font-weight: 700; }
.history-desc { flex: 1; color: var(--text2); line-height: 1.5; }
.history-time { color: var(--text4); white-space: nowrap; font-size: 10px; }

/* ── CSV export button ── */
.csv-btn {
  background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
  padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all .15s; display: flex; align-items: center; gap: 4px;
}
.csv-btn:hover { background: var(--accent-lt); }

/* ══ Executive look — white / sky blue / gold ══════════════════════════════ */
:root {
  --ex-sky:#3E9BD6; --ex-sky-dk:#1B6FA8; --ex-sky-lt:#DCEDF9; --ex-sky-pale:#F3F8FC;
  --ex-gold:#B08A3E; --ex-gold-lt:#F5EEDF; --ex-gold-dk:#7E6024;
  --ex-ink:#0F2A40; --ex-mute:#5D7186; --ex-faint:#8DA0B3; --ex-line:#E4ECF3;
  --ex-serif:'Lora',Georgia,'Times New Roman',serif;
  --ex-shadow:0 1px 2px rgba(15,42,64,.04), 0 10px 30px rgba(15,42,64,.05);
  /* app-wide accent follows the sky palette */
  --accent:#1B6FA8; --accent-lt:#EAF4FB; --accent-mid:#3E9BD6;
}

/* Frame: header + sidebar */
.app-header { height:64px; padding:0 28px; border-bottom:1px solid var(--ex-line); background:#fff; }
.app-header img { height:34px !important; }
.app-header-title { margin-left:22px; padding-left:22px; border-left:1px solid var(--ex-gold); font-family:var(--ex-serif); font-size:17px; font-weight:600; color:var(--ex-ink); letter-spacing:.01em; }
.app-header-date { margin-left:auto; font-size:12px; color:var(--ex-faint); letter-spacing:.3px; }
.sidebar { width:68px; background:#fff; border-right:1px solid var(--ex-line); padding:18px 0; }
.sb-nav { gap:6px; padding:0 10px; }
.sb-icon { width:48px; height:46px; border-radius:12px; color:var(--ex-faint); position:relative; }
.sb-icon:hover { background:var(--ex-sky-pale); color:var(--ex-sky-dk); }
.sb-icon.active { background:var(--ex-sky-pale); color:var(--ex-sky-dk); }
.sb-icon.active::before { content:''; position:absolute; left:-10px; top:11px; bottom:11px; width:3px; border-radius:0 3px 3px 0; background:var(--ex-gold); }
.sb-icon::after { content:attr(data-label); position:absolute; left:58px; top:50%; transform:translateY(-50%); background:var(--ex-ink); color:#fff; font:500 12px 'Inter',sans-serif; padding:6px 10px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s; z-index:999; }
.sb-icon:hover::after { opacity:1; }

#view-executive, #view-reports { background:#fff; }
.ex-scroll { flex:1; overflow-y:auto; }
.ex-wrap { max-width:1280px; margin:0 auto; padding:0 40px 56px; }

/* Hero */
.ex-hero { background:var(--ex-sky-pale); border-bottom:1px solid var(--ex-line); position:relative; }
.ex-hero::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg, var(--ex-gold) 0, var(--ex-gold) 120px, transparent 120px); }
.ex-hero-in { max-width:1280px; margin:0 auto; padding:44px 40px 36px; display:flex; justify-content:space-between; align-items:flex-end; gap:28px; flex-wrap:wrap; }
.ex-eyebrow { font-size:11px; font-weight:600; letter-spacing:2.6px; text-transform:uppercase; color:var(--ex-gold); }
.ex-title { font-family:var(--ex-serif); font-size:42px; font-weight:600; color:var(--ex-ink); margin-top:10px; line-height:1.08; letter-spacing:-.01em; }
.ex-rule { width:48px; height:2px; background:var(--ex-gold); margin:18px 0 16px; }
.ex-summary { font-size:16px; color:var(--ex-mute); line-height:1.65; max-width:700px; font-weight:400; }
.ex-summary strong { color:var(--ex-ink); font-weight:600; }
.ex-datanote { font-size:12px; color:var(--ex-faint); margin-top:12px; letter-spacing:.2px; }
.ex-hero-actions { display:flex; gap:10px; align-items:center; }
.ex-date { font-size:12px; color:var(--ex-faint); margin-right:6px; }

/* Buttons */
.ex-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:10px; font:600 12.5px 'Inter',sans-serif; letter-spacing:.2px; cursor:pointer; border:1px solid var(--ex-line); background:#fff; color:var(--ex-ink); transition:all .15s; }
.ex-btn:hover { border-color:var(--ex-sky); color:var(--ex-sky-dk); }
.ex-btn.primary { background:var(--ex-ink); border-color:var(--ex-ink); color:#fff; }
.ex-btn.primary:hover { background:var(--ex-sky-dk); border-color:var(--ex-sky-dk); color:#fff; }
.ex-mini { font:600 11.5px 'Inter',sans-serif; padding:6px 11px; border-radius:8px; border:1px solid var(--ex-line); background:#fff; color:var(--ex-sky-dk); cursor:pointer; white-space:nowrap; transition:all .15s; }
.ex-mini:hover { border-color:var(--ex-sky); background:var(--ex-sky-pale); }
.ex-mini.danger { color:#8A2C36; padding:6px 9px; }
.ex-mini.danger:hover { border-color:#E3C9CC; background:#FBF2F3; }
.ex-link { color:var(--ex-sky-dk); font-weight:600; font-size:12.5px; text-decoration:none; }
.ex-link:hover { text-decoration:underline; }

/* KPI strip — one surface, hairline dividers, serif numerals */
.ex-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:32px 0; background:#fff; border:1px solid var(--ex-line); border-radius:16px; box-shadow:var(--ex-shadow); overflow:hidden; }
.ex-kpi { padding:22px 24px; border-left:1px solid var(--ex-line); position:relative; }
.ex-kpi:first-child { border-left:none; }
.ex-kpi.gold::before { content:''; position:absolute; left:24px; top:0; width:28px; height:2px; background:var(--ex-gold); }
.ex-kpi-label { font-size:10.5px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--ex-faint); }
.ex-kpi-val { font-family:var(--ex-serif); font-size:34px; font-weight:600; color:var(--ex-ink); margin-top:10px; line-height:1; font-variant-numeric:lining-nums tabular-nums; }
.ex-kpi.gold .ex-kpi-val { color:var(--ex-gold-dk); }
.ex-kpi-sub { font-size:11.5px; color:var(--ex-mute); margin-top:8px; line-height:1.4; }

/* Cards */
.ex-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:24px; margin-bottom:24px; }
.ex-grid-map { grid-template-columns:minmax(0,1.65fr) minmax(0,1fr); }
.ex-grid-even { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
.ex-card { background:#fff; border:1px solid var(--ex-line); border-radius:16px; padding:24px 26px; box-shadow:var(--ex-shadow); min-width:0; }
.ex-card-hd { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:18px; }
.ex-card-title { font-family:var(--ex-serif); font-size:20px; font-weight:600; color:var(--ex-ink); letter-spacing:-.005em; }
.ex-card-note { font-size:12px; color:var(--ex-faint); }
.ex-empty { font-size:13px; color:var(--ex-mute); padding:10px 0; }
.ex-method { font-size:11.5px; color:var(--ex-faint); margin-top:16px; line-height:1.55; padding-top:14px; border-top:1px solid var(--ex-line); }
.ex-sub-title { font-size:10.5px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--ex-faint); margin:22px 0 6px; }
.ex-tag { font-size:9.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; padding:4px 9px; border-radius:20px; white-space:nowrap; }
.ex-tag.lead { background:var(--ex-gold-lt); color:var(--ex-gold-dk); }
.ex-tag.stake { background:var(--ex-sky-lt); color:var(--ex-sky-dk); }

/* Map widget */
.ex-map-card { padding:0; overflow:hidden; display:flex; flex-direction:column; }
.ex-map-card .ex-card-hd { padding:22px 26px 0; margin-bottom:14px; }
.ex-map { flex:none; height:460px; background:#EEF3F7; position:relative; }
.ex-map-legend { position:absolute; left:16px; bottom:16px; z-index:500; background:rgba(255,255,255,.94); border:1px solid var(--ex-line); border-radius:10px; padding:8px 12px; display:flex; gap:14px; font-size:11px; color:var(--ex-mute); box-shadow:0 4px 14px rgba(15,42,64,.08); }
.ex-map-legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
.need-key { display:inline-flex; align-items:center; gap:6px; font:500 11px 'Inter',sans-serif; color:var(--ex-mute); background:none; border:1px solid transparent; border-radius:20px; padding:3px 8px; cursor:pointer; transition:all .15s; white-space:nowrap; }.need-key i { display:inline-block; width:10px; height:10px; border-radius:50%; flex-shrink:0; }.need-key:hover { border-color:var(--ex-line); color:var(--ex-ink); background:#fff; }.need-key.on { border-color:var(--ex-sky); color:var(--ex-ink); background:var(--ex-sky-pale); font-weight:600; }.need-key.dim { opacity:.45; }.need-key-all { color:var(--ex-sky-dk); font-weight:600; }.ex-map-legend { gap:2px !important; padding:5px 6px !important; flex-wrap:wrap; }.need-key-col { display:flex; flex-direction:column; align-items:flex-start; gap:1px; margin:0 -8px 2px; }
.ex-pop { font-family:'Inter',sans-serif; min-width:190px; }
.ex-pop-name { font-family:var(--ex-serif); font-size:16px; font-weight:600; color:var(--ex-ink); }
.ex-pop-meta { font-size:11.5px; color:var(--ex-mute); margin:3px 0 10px; }
.ex-pop-row { display:flex; gap:6px; }
.leaflet-popup-content-wrapper { border-radius:12px !important; box-shadow:0 12px 32px rgba(15,42,64,.18) !important; }

/* Ranked list (highest need) */
.ex-rank { display:grid; grid-template-columns:22px minmax(0,1fr) 110px 28px; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--ex-line); cursor:pointer; border-radius:8px; transition:background .12s; }
.ex-rank:last-of-type { border-bottom:none; }
.ex-rank:hover { background:var(--ex-sky-pale); }
.ex-rank-n { font-family:var(--ex-serif); font-size:14px; color:var(--ex-faint); text-align:right; }
.ex-rank-name { font-size:13.5px; font-weight:600; color:var(--ex-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-rank-sub { font-size:11.5px; color:var(--ex-mute); font-weight:400; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-rank-score { font-family:var(--ex-serif); font-size:16px; font-weight:600; color:var(--ex-ink); text-align:right; }

/* Bars + tables */
.ex-stage { display:grid; grid-template-columns:130px 1fr 74px; align-items:center; gap:12px; margin-bottom:12px; font-size:13px; }
.ex-stage-name { color:var(--ex-ink); font-weight:500; }
.ex-stage-track { height:6px; background:var(--ex-sky-pale); border-radius:3px; overflow:hidden; }
.ex-stage-fill { height:100%; background:var(--ex-sky); border-radius:3px; }
.ex-stage-val { text-align:right; color:var(--ex-mute); font-variant-numeric:tabular-nums; }
.ex-share { display:flex; align-items:center; gap:8px; }
.ex-share-track { flex:1; height:6px; background:var(--ex-sky-pale); border-radius:3px; overflow:hidden; min-width:50px; }
.ex-share-fill { height:100%; background:var(--ex-sky); border-radius:3px; }
.ex-table { width:100%; border-collapse:collapse; font-size:13px; }
.ex-table th { text-align:left; font-size:10.5px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ex-faint); padding:0 10px 10px; border-bottom:1px solid var(--ex-line); }
.ex-table td { padding:13px 10px; border-bottom:1px solid var(--ex-line); color:var(--ex-ink); vertical-align:middle; }
.ex-table tr:last-child td { border-bottom:none; }
.ex-table tbody tr:hover td { background:var(--ex-sky-pale); }
.ex-table .num { text-align:right; font-variant-numeric:tabular-nums; }

/* Report rows */
.ex-rep { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--ex-line); font-size:13px; color:var(--ex-ink); }
.ex-rep:last-child { border-bottom:none; }
.ex-rep a { margin-left:auto; color:var(--ex-sky-dk); font-weight:600; text-decoration:none; font-size:12px; }
.ex-rep a:hover { text-decoration:underline; }

/* Reports view */
.rep-help { font-size:13px; color:var(--ex-mute); line-height:1.6; margin-bottom:16px; }
.rep-input { width:100%; box-sizing:border-box; padding:11px 13px; border:1px solid var(--ex-line); border-radius:10px; font:13.5px 'Inter',sans-serif; color:var(--ex-ink); background:#fff; transition:border-color .15s, box-shadow .15s; }
.rep-input:focus { outline:none; border-color:var(--ex-sky); box-shadow:0 0 0 3px var(--ex-sky-lt); }
.rep-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.rep-qs-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.rep-qs { font:500 11.5px 'Inter',sans-serif; padding:6px 12px; border:1px solid var(--ex-line); border-radius:20px; background:#fff; color:var(--ex-mute); cursor:pointer; transition:all .15s; }
.rep-qs:hover { border-color:var(--ex-sky); color:var(--ex-sky-dk); }
.rep-qs.on { background:var(--ex-ink); border-color:var(--ex-ink); color:#fff; }
.rep-chips { display:flex; gap:6px; flex-wrap:wrap; }
.rep-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:2px 16px; max-height:270px; overflow:auto; border:1px solid var(--ex-line); border-radius:12px; padding:12px 14px; background:#FCFDFE; }
.rep-chk { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ex-ink); cursor:pointer; padding:4px 0; }
.rep-chk input { accent-color:var(--ex-sky-dk); }
.rep-chk span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rep-toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:var(--ex-ink); color:#fff; font-size:13px; padding:13px 20px; border-radius:12px; border-left:3px solid var(--ex-gold); box-shadow:0 12px 32px rgba(0,0,0,.22); opacity:0; pointer-events:none; transition:all .25s; z-index:5000; max-width:90vw; }
.rep-toast.show { opacity:1; transform:translate(-50%,0); }

/* Countries view */
#view-countries { flex-direction:column; }
.map-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 28px; background:#fff; border-bottom:1px solid var(--ex-line); flex-shrink:0; flex-wrap:wrap; }
.map-toolbar-title { font-family:var(--ex-serif); font-size:22px; font-weight:600; color:var(--ex-ink); }
.map-toolbar-sub { font-size:12px; color:var(--ex-mute); }
.cd-reports .ex-rep { padding:9px 0; font-size:12.5px; }

/* Severity colour coding (0 severe · 1 high concern · 2 moderate · 3 on track) */
:root { --sev0:#E5484D; --sev0-bg:#FFECEC; --sev0-tx:#C8282E; --sev1:#F5871F; --sev1-bg:#FFF1E2; --sev1-tx:#C2620A; --sev2:#F5C518; --sev2-bg:#FFF8D9; --sev2-tx:#8C6A00; --sev3:#1FAF6B; --sev3-bg:#E3F7EC; --sev3-tx:#13804C; }
.cd-stat-card.sev-0, .ca-ind-card.sev-0 { border-left:3px solid var(--sev0); }
.cd-stat-card.sev-1, .ca-ind-card.sev-1 { border-left:3px solid var(--sev1); }
.cd-stat-card.sev-2, .ca-ind-card.sev-2 { border-left:3px solid var(--sev2); }
.cd-stat-card.sev-3, .ca-ind-card.sev-3 { border-left:3px solid var(--sev3); }
.sev-0 .cd-stat-val, .sev-0 .ca-ind-val { color:var(--sev0-tx); }
.sev-1 .cd-stat-val, .sev-1 .ca-ind-val { color:var(--sev1-tx); }
.sev-2 .cd-stat-val, .sev-2 .ca-ind-val { color:var(--sev2-tx); }
.sev-3 .cd-stat-val, .sev-3 .ca-ind-val { color:var(--sev3-tx); }
.sev-pill { display:inline-block; margin-left:6px; font-size:8.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:2px 6px; border-radius:10px; vertical-align:1px; white-space:nowrap; }
.sev-p0 { background:var(--sev0); color:#fff; }
.sev-p1 { background:var(--sev1); color:#fff; }
.sev-p2 { background:var(--sev2); color:#5C4600; }
.sev-p3 { background:var(--sev3); color:#fff; }
.sev-legend { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:11px; color:var(--ex-mute); margin:0 0 10px; }
.sev-legend-note { color:var(--ex-faint); }
.sev-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
.sev-d0 { background:var(--sev0); } .sev-d1 { background:var(--sev1); } .sev-d2 { background:var(--sev2); } .sev-d3 { background:var(--sev3); }
.sevc-0 { background:var(--sev0-bg) !important; color:var(--sev0-tx) !important; font-weight:700; box-shadow:inset 3px 0 0 var(--sev0); }
.sevc-1 { background:var(--sev1-bg) !important; color:var(--sev1-tx) !important; font-weight:600; box-shadow:inset 3px 0 0 var(--sev1); }
.sevc-2 { background:var(--sev2-bg) !important; color:var(--sev2-tx) !important; box-shadow:inset 3px 0 0 var(--sev2); }
.sevc-3 { background:var(--sev3-bg) !important; color:var(--sev3-tx) !important; box-shadow:inset 3px 0 0 var(--sev3); }

/* Region rows on the landing page open the popup */
.ex-region-row { cursor:pointer; padding:8px 10px; margin:0 -10px 6px !important; border-radius:10px; transition:background .12s; }
.ex-region-row:hover { background:var(--ex-sky-pale); }
.ex-region-link { color:var(--ex-sky-dk); font-weight:600; }

/* Region popup */
.rp-overlay { position:fixed; inset:0; z-index:4500; background:rgba(15,42,64,.45); display:none; align-items:flex-start; justify-content:center; padding:4vh 20px; overflow-y:auto; backdrop-filter:blur(2px); }
.rp-overlay.open { display:flex; }
.rp-modal { background:#fff; width:100%; max-width:1180px; border-radius:18px; box-shadow:0 30px 80px rgba(15,42,64,.3); overflow:hidden; animation:rpIn .2s ease-out; }
@keyframes rpIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.rp-hd { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding:28px 32px 22px; background:var(--ex-sky-pale); border-bottom:1px solid var(--ex-line); position:relative; }
.rp-hd::after { content:''; position:absolute; left:32px; bottom:-1px; width:90px; height:2px; background:var(--ex-gold); }
.rp-title { font-family:var(--ex-serif); font-size:30px; font-weight:600; color:var(--ex-ink); margin-top:8px; line-height:1.15; }
.rp-sub { font-size:12.5px; color:var(--ex-mute); margin-top:8px; }
.rp-status { display:inline-block; margin-left:6px; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:20px; background:#EEF2F6; color:var(--ex-mute); }
.rp-status.live { background:var(--sev3-bg); color:var(--sev3); }
.rp-actions { display:flex; gap:10px; align-items:center; flex-shrink:0; }
.rp-close { width:38px; height:38px; border-radius:10px; border:1px solid var(--ex-line); background:#fff; color:var(--ex-mute); font-size:14px; cursor:pointer; }
.rp-close:hover { color:var(--ex-ink); border-color:var(--ex-sky); }
.rp-body { padding:24px 32px 28px; }
.rp-meds { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:26px; }
.rp-med { border:1px solid var(--ex-line); border-left:3px solid var(--ex-line); border-radius:10px; padding:12px 14px; background:#fff; }
.rp-med.sev-0 { border-left-color:var(--sev0); background:var(--sev0-bg); }
.rp-med.sev-1 { border-left-color:var(--sev1); background:var(--sev1-bg); }
.rp-med.sev-2 { border-left-color:var(--sev2); background:var(--sev2-bg); }
.rp-med.sev-3 { border-left-color:var(--sev3); background:var(--sev3-bg); }
.rp-med-l { font-size:10.5px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--ex-mute); }
.rp-med-v { font-family:var(--ex-serif); font-size:22px; font-weight:600; color:var(--ex-ink); margin-top:6px; }
.rp-med-s { font-size:11px; color:var(--ex-mute); margin-top:4px; }
.rp-med-s a { color:var(--ex-sky-dk); text-decoration:none; font-weight:600; }
.rp-med-s a:hover { text-decoration:underline; }
.cd-key-meds { margin-bottom:4px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
.rp-tbl-hd { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.rp-tbl-hd .sev-legend { margin:0; }

/* Country panel: opens to about half the page; overview block on top */.drawer { height:56%; max-height:none !important; }.cd-ov { display:grid; grid-template-columns:minmax(240px, 34%) minmax(0, 1fr); gap:22px; align-items:start; }.cd-ov-map { position:relative; border-radius:12px; overflow:hidden; background:#EAF2F8; aspect-ratio:4 / 3; }.cd-ov-map img#cd-ov-map-img { width:100%; height:100%; object-fit:contain; display:block; opacity:0; transition:opacity .3s; }.cd-ov-map img#cd-ov-map-img.on { opacity:1; }.cd-ov-flag { position:absolute; top:10px; inset-inline-start:10px; background:#fff; padding:3px; border-radius:4px; box-shadow:0 2px 8px rgba(15,42,64,.18); line-height:0; }.cd-ov-flag img { height:30px; width:auto; display:block; border-radius:2px; }.cd-ov-body { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; }.cd-ov-facts { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; align-content:start; }.cd-ov-k { font-size:10.5px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--ex-faint); }.cd-ov-v { font-size:13.5px; font-weight:600; color:var(--ex-ink); margin-top:3px; line-height:1.35; }.cd-ov-since, .cd-ov-wait { font-weight:400; color:var(--ex-mute); font-size:11.5px; }.cd-ov-pol { background:var(--ex-sky-pale); border-radius:12px; padding:12px 14px; }.cd-ov-pol-hd { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--ex-gold); margin-bottom:8px; }.cd-ov-pol-hd span { display:block; text-transform:none; letter-spacing:0; font-weight:500; color:var(--ex-mute); font-size:11px; margin-top:2px; }.cd-ov-wgi { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(40px,1fr) 26px; gap:8px; align-items:center; padding:4px 0; font-size:12px; color:var(--ex-ink); }.cd-ov-wgi-t { height:6px; background:#fff; border-radius:3px; overflow:hidden; display:block; }.cd-ov-wgi-t i { display:block; height:100%; border-radius:3px; }.cd-ov-wgi-v { font-weight:700; text-align:end; font-variant-numeric:tabular-nums; }.cd-ov-src { font-size:10.5px; color:var(--ex-faint); margin-top:8px; }[dir="rtl"] .cd-ov-k, [dir="rtl"] .cd-ov-pol-hd { letter-spacing:0; text-transform:none; font-size:12px; }@media (max-width: 1100px) { .cd-ov-body { grid-template-columns:1fr; } }@media (max-width: 760px) { .cd-ov { grid-template-columns:1fr; } .drawer { height:70%; } }

// ══════════════════════════════════════════════════════════════════════════
// LANGUAGE — English / Arabic. Arabic switches the page to right-to-left
// (the layout mirrors), translates every label, country, region and indicator,
// relabels the map in Arabic and builds reports in Arabic.
// ══════════════════════════════════════════════════════════════════════════
try { lang = localStorage.getItem('cad_lang') === 'ar' ? 'ar' : 'en'; } catch (e) {}
const isAr = () => lang === 'ar';
const tr = (en, ar) => lang === 'ar' ? ar : en;                       // pick the string for the current language
const cN = c => lang === 'ar' ? (AR_COUNTRY[c] || c) : c;               // country display name
const rN = r => lang === 'ar' ? (AR_REGION[r] || r) : r;                // region display name
const incN = code => lang === 'ar' ? (AR_INCOME[code] || '')
  : ({ LIC:'Low income', LMIC:'Lower-middle income', UMIC:'Upper-middle income' }[code] || '');
const byName = (a, b) => cN(a).localeCompare(cN(b), lang === 'ar' ? 'ar' : 'en');
const LOCALE = () => lang === 'ar' ? 'ar-AE-u-nu-latn' : 'en-GB';     // Arabic month names, Western digits
const AR_UNIT = { ' yrs':' سنة', ' /1,000':' لكل 1,000', ' /100':' لكل 100', ' /100k':' لكل 100 ألف', ' /1k':' لكل ألف',
  ' /M':' لكل مليون', ' /km²':' /كم²', ' USD':' دولار', ' kWh/cap':' ك.و.س للفرد', ' kcal/day':' سعرة/يوم',
  ' kg oil eq':' كغ مكافئ نفط', ' kg/ha':' كغ/هكتار', ' t':' طن' };
const unitN = u => lang === 'ar' && AR_UNIT[u] != null ? AR_UNIT[u] : (u || '');

function applyStaticLang() {
  const ar = isAr();
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir  = ar ? 'rtl' : 'ltr';
  document.title = ar ? 'لوحة تقييم الدول' : 'Country Assessment Dashboard';
  document.querySelectorAll('[data-ar]').forEach(el => {
    if (el.dataset.en == null) el.dataset.en = el.textContent;
    el.textContent = ar ? el.dataset.ar : el.dataset.en;
  });
  document.querySelectorAll('.sb-icon[data-label]').forEach(el => {
    if (el.dataset.labelEn == null) el.dataset.labelEn = el.dataset.label;
    el.dataset.label = ar ? el.dataset.labelAr : el.dataset.labelEn;
    el.setAttribute('aria-label', el.dataset.label);
  });
  document.querySelectorAll('.lang-opt').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  const hd = document.getElementById('app-header-date');
  if (hd) hd.textContent = new Date().toLocaleDateString(LOCALE(), { day:'numeric', month:'long', year:'numeric' });
  const hs = document.getElementById('hdr-search-in');
  if (hs) { hs.placeholder = ar ? 'ابحث عن دولة…' : 'Search countries…'; hs.setAttribute('aria-label', hs.placeholder); }
}

// ── Header country search: type a name (English or Arabic) → opens that country's profile on the map ──
const srchNorm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ًͯ-ْـ]/g, '')
  .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[^a-z0-9؀-ۿ]+/g, ' ').trim();
let srchHits = [], srchIdx = 0;
function hdrSearchInput(v) {
  const box = document.getElementById('hdr-search-res'); if (!box) return;
  const q = srchNorm(v);
  if (!q) { box.hidden = true; srchHits = []; return; }
  const all = (typeof repAllCountries === 'function' && repAllCountries().length ? repAllCountries() : Object.keys(COUNTRY_ISO));
  const score = c => { const n = [srchNorm(c), srchNorm(AR_COUNTRY[c] || '')];
    return n.some(x => x.startsWith(q)) ? 0 : n.some(x => x.split(' ').some(w => w.startsWith(q))) ? 1 : n.some(x => x.includes(q)) ? 2 : 9; };
  srchHits = all.map(c => [c, score(c)]).filter(x => x[1] < 9).sort((a, b) => a[1] - b[1] || cN(a[0]).localeCompare(cN(b[0]), lang)).slice(0, 8).map(x => x[0]);
  srchIdx = 0;
  box.innerHTML = srchHits.length ? srchHits.map((c, i) => `<button type="button" class="hs-item${i === 0 ? ' on' : ''}" onmousedown="event.preventDefault();hdrSearchGo(${qa(c)})">
      <span class="hs-name">${exEsc(cN(c))}</span><span class="hs-reg">${exEsc(rN(repRegionOf(c) || ''))}</span></button>`).join('')
    : `<div class="hs-empty">${tr('No country matches', 'لا توجد دولة مطابقة')}</div>`;
  box.hidden = false;
}
function hdrSearchKey(e) {
  const box = document.getElementById('hdr-search-res');
  if (e.key === 'Escape') { e.target.value = ''; hdrSearchInput(''); e.target.blur(); return; }
  if (!srchHits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); srchIdx = (srchIdx + (e.key === 'ArrowDown' ? 1 : -1) + srchHits.length) % srchHits.length;
    box.querySelectorAll('.hs-item').forEach((b, i) => b.classList.toggle('on', i === srchIdx));
  } else if (e.key === 'Enter') { e.preventDefault(); hdrSearchGo(srchHits[srchIdx]); }
}
function hdrSearchGo(c) {
  const inp = document.getElementById('hdr-search-in'); if (inp) { inp.value = ''; inp.blur(); }
  hdrSearchInput('');
  goView('countries');
  setTimeout(() => mapJumpTo(c), 120);
}

function setLang(l) {

// World outline drawn from Natural Earth (world-atlas TopoJSON) instead of map tiles, so
// the map carries no baked-in English text; country labels come from us, in the chosen language.
const WORLD_GEO = {};
// Russia and Fiji straddle the 180° line; drawn as-is their outlines streak across the whole
// map. Shift those rings' western points by +360° so each shape stays in one piece.
function geoFixDateline(g) {
  const fixRing = ring => { let mn = Infinity, mx = -Infinity;
    ring.forEach(p => { if (p[0] < mn) mn = p[0]; if (p[0] > mx) mx = p[0]; });
    if (mx - mn > 180) ring.forEach(p => { if (p[0] < 0) p[0] += 360; }); };
  g.features.forEach(f => { const gm = f.geometry; if (!gm) return;
    (gm.type === 'Polygon' ? [gm.coordinates] : gm.type === 'MultiPolygon' ? gm.coordinates : []).forEach(poly => poly.forEach(fixRing)); });
  return g;
}
function loadWorld(res) {
  if (!WORLD_GEO[res]) WORLD_GEO[res] = fetch(`https://cdn.jsdelivr.net/npm/world-atlas@2/countries-${res}.json`)
    .then(r => r.json()).then(t => topojson.feature(t, t.objects.countries))
    .then(g => { g.features = g.features.filter(f => f.id !== '010'); return geoFixDateline(g); });   // drop Antarctica
  return WORLD_GEO[res];
}
function addWorldLayer(m, res) {
  m.getContainer().classList.add('vec-map');
  return loadWorld(res).then(geo => {
    if (!m._panes || !m._panes.overlayPane || !m.getContainer().isConnected) return null;   // map was replaced while loading
    const layer = L.geoJSON(geo, { interactive:false, style:{ color:'#FFFFFF', weight:0.9, fillColor:'#DCE3EB', fillOpacity:1 } }).addTo(m);
    layer.bringToBack();
    return layer;
  }).catch(() => {   // offline / blocked → fall back to the label-free-at-low-zoom Esri canvas
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom:12 }).addTo(m);
  });
}

function switchView(view, navEl) {

  target.classList.add('active');

function restoreView() {
  // Executive View is the landing page. A link ending in #executive always opens it;
  // otherwise a returning user goes back to the view they were last on.
  const landing = () => goView('executive');

    if (location.hash === '#executive') return landing();
    const v = localStorage.getItem('cad_view');

function relTime(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// ── Map ───────────────────────────────────────────────────────────────────
// Both dashboard maps use the report map style: every tracked country is drawn from its
// Natural Earth outline and filled by need tier (same shades as the reports). Very small

const geoName = c => (typeof GEO_NAME !== 'undefined' && GEO_NAME[c]) || c;
function trackedCountryLayer(m, res, style, bind) {
  return loadWorld(res).then(geo => {
    if (!m._panes || !m._panes.overlayPane || !m.getContainer().isConnected) return {};
    const byGeo = {}; Object.keys(COUNTRY_LATLNG).forEach(c => { byGeo[geoName(c)] = c; });
    const out = {};
    L.geoJSON({ type:'FeatureCollection', features: geo.features.filter(f => byGeo[f.properties.name]) }, {
      style: f => style(byGeo[f.properties.name]),
      onEachFeature: (f, layer) => { const c = byGeo[f.properties.name]; out[c] = { layer }; bind(c, layer); },
    }).addTo(m);
    Object.keys(COUNTRY_LATLNG).forEach(c => {
      const o = out[c] || (out[c] = {});
      const b = o.layer && o.layer.getBounds();
      if (!o.layer || (b.getNorth() - b.getSouth() < 2.2 && b.getEast() - b.getWest() < 2.2)) {
        o.dot = L.circleMarker(COUNTRY_LATLNG[c], { radius:5.5, weight:1.5, color:'#FFFFFF', fillColor: NEED_SHADES[needTier(c)], fillOpacity:1 }).addTo(m);
        bind(c, o.dot);

}
const needTip = c => { const n = needScores()[c] || {}, total = (needScores().__ranked || []).length;

// Full Countries map
let mapCountries = {}, mapSel = null;
function mapStyle(c) {
  const t = needTier(c), on = !mapTier || t === mapTier, sel = c === mapSel;
  return { color: sel ? '#C9A13D' : '#FFFFFF', weight: sel ? 3 : 0.9, fillColor: NEED_SHADES[t], fillOpacity: on ? 0.92 : 0.12, opacity: on ? 1 : 0.35 };

function initMap() {

function sparkHtml(s, fv, rule) {
  const W = 520, H = 120, P = 26, xs = s.map(p => p[0]), ys = s.map(p => p[1]);

  const X = x => P + (x - x0) / ((x1 - x0) || 1) * (W - 2 * P), Y = y => H - 22 - (y - y0) / dy * (H - 44);
  const pts = s.map(([x, y]) => X(x).toFixed(1) + ',' + Y(y).toFixed(1)).join(' ');
  const first = s[0], last = s[s.length - 1], chg = last[1] - first[1];
  const better = rule && !rule.peers ? (rule.dir > 0 ? chg < 0 : chg > 0) : null;
  const ltr = isAr() ? ' style="direction:ltr"' : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="idm-spark"${ltr}>
      <polyline points="${pts}" fill="none" stroke="var(--ex-sky-dk, #1B6FA8)" stroke-width="2.5" stroke-linejoin="round"/>
      ${s.map(([x, y]) => `<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.6" fill="var(--ex-sky-dk, #1B6FA8)"/>`).join('')}
      <text x="${P}" y="${H - 4}" font-size="11" fill="#8DA0B3">${first[0]}</text><text x="${W - P}" y="${H - 4}" font-size="11" fill="#8DA0B3" text-anchor="end">${last[0]}</text>
      <text x="${X(first[0])}" y="${Y(first[1]) - 8}" font-size="11.5" font-weight="700" fill="#0F2A40">${exEsc(fv(first[1]))}</text>
      <text x="${X(last[0])}" y="${Y(last[1]) - 8}" font-size="11.5" font-weight="700" fill="#0F2A40" text-anchor="end">${exEsc(fv(last[1]))}</text>
    </svg>
    <div class="idm-org">${tr(`${first[0]}–${last[0]}: `, `${first[0]}–${last[0]}: `)}${better == null ? '' : better ? tr('improving', 'في تحسّن') : tr('worsening', 'في تراجع')} (${chg > 0 ? '+' : ''}${exEsc(fv(chg).replace(/^\$-/, '-$'))})</div>`;
}

// ── Saved reports library (IndexedDB — this browser only) ────────────────
const RepStore = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('cad_reports', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('reports', { keyPath: 'id' });
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      } catch (e) { rej(e); }
    });
    return this._db;
  },
  async _req(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('reports', mode);
      const rq = fn(t.objectStore('reports'));
      t.oncomplete = () => res(rq.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  put(rec) { return this._req('readwrite', s => s.put(rec)); },
  get(id)  { return this._req('readonly',  s => s.get(id)); },
  del(id)  { return this._req('readwrite', s => s.delete(id)); },
  async all() { try { return (await this._req('readonly', s => s.getAll())) || []; } catch (e) { return []; } },
};
let REP_LIBRARY = [];   // newest first; refreshed by onReportsChanged()
async function repSave(rec) {

}
async function repLibDownload(id) {
  const rec = await RepStore.get(id).catch(() => null);

async function repLibDelete(id) {
  const rec = REP_LIBRARY.find(r => r.id === id);
  if (!confirm(tr('Remove "' + (rec ? recTitle(rec) : 'this report') + '" from the saved reports in this browser?',
                  'حذف «' + (rec ? recTitle(rec) : 'هذا التقرير') + '» من التقارير المحفوظة في هذا المتصفح؟'))) return;
  await RepStore.del(id).catch(() => {});

}
async function onReportsChanged() {

        const ring = polys(r.geom).map(p => p[0]).sort((a, b) => Math.abs(ringArea(b)) - Math.abs(ringArea(a)))[0]; if (!ring) return;
        const A = ringArea(ring); if (!A) return;
        let sx = 0, sy = 0; ring.forEach((p, i) => { const q = ring[(i + 1) % ring.length], c = p[0] * q[1] - q[0] * p[1]; sx += (p[0] + q[0]) * c; sy += (p[1] + q[1]) * c; });
        const x = px(sx / (6 * A)), y = py(sy / (6 * A));
        g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,.85)'; g.strokeText(r.name, x, y); g.fillStyle = '#0F2A40'; g.fillText(r.name, x, y);
      });
    }
    return cv.toDataURL('image/png');
  } catch (e) { console.warn('[CAD] sub-national map failed', e); return null; }
}
// Live headline indicators for many countries at once — one World Bank call per indicator.
async function repRegionLive(countries, ids) {
  const isoToName = {}, isos = [];
  countries.forEach(c => { const iso = COUNTRY_ISO[c]; if (iso) { isoToName[iso] = c; isos.push(iso); } });
  const out = {}; let ok = 0;
  await Promise.all(ids.map(async id => {
    try {
      const url = `https://api.worldbank.org/v2/country/${isos.join(';')}/indicator/${id}?format=json&mrv=5&per_page=5000`;
      const r = await Promise.race([fetch(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000))]);   // the WB API can take 10s+
      if (!r.ok) return;
      const j = await r.json(); if (!j || !j[1]) return;
      ok++;
      j[1].forEach(row => {
        const c = isoToName[row.countryiso3code]; if (!c || row.value == null) return;
        out[c] = out[c] || {};
        const cur = out[c][id];
        if (!cur || Number(row.date) > Number(cur.year)) out[c][id] = { value: row.value, year: row.date };
      });
    } catch (e) { /* keep snapshot values */ }
  }));
  return { data: out, live: ok > 0 };
}

      <div class="fmt-foot"><button type="button" class="ex-btn" data-k="">${tr('Cancel', 'إلغاء')}</button></div></div>`;
    const done = k => { ov.remove(); document.removeEventListener('keydown', esc); if (k) { try { localStorage.setItem('oda_rep_format', k); } catch (e) {} } resolve(k || null); };
    const esc = e => { if (e.key === 'Escape') done(null); };

// SEVERITY — colour-codes indicator values (0 severe · 1 high · 2 moderate · 3 good)
// Benchmarks follow SDG / WHO / UNESCO reference points where one exists; for
// indicators without a standard benchmark the value is compared with the other
// tracked countries (worst quarter = severe … best quarter = good).
// dir +1 = higher is worse, -1 = lower is worse; th = [severe, high, moderate] cut-offs.
// ══════════════════════════════════════════════════════════════════════════
// SEV_RULES / SEV_LABELS / sevLevel come from severity.js (shared with the report builders).
const sevLabel = i => SEV_LABELS[lang === 'ar' ? 'ar' : 'en'][i];
let SEV_PEER_CACHE = {};
function indSeverity(id, v) {
  const r = SEV_RULES[id];
  if (!r || v == null || isNaN(v)) return null;
  let lvl;

// Full AI report — live AI deep-research country deck via the local research server (localhost only).
// Fills the exact 23-slide ODA country-proposal template through the server's /country_report
// pipeline; long-running, and the file is saved to Downloads on the server computer. A record of
// it is added to the saved-reports library. Returns true on success. (English only for now.)
async function cd_generateAICountryDeck(country, label, quiet){
  const base=repServerBase();
  const ov=cd_progressOverlay(tr('Full AI report · ', 'تقرير الذكاء الاصطناعي · ')+cN(country)+(label?' ('+label+')':''), tr('Checking the local research server…', 'جارٍ التحقق من خادم البحث المحلي…'));
  try{
    let up=false;
    try{ const h=await fetch(base+'/health',{method:'GET'}); const hj=await h.json(); up=!!(hj&&hj.ok&&hj.key); }catch(e){}
    if(!up){ ov.remove(); alert(repAiHelp()); return false; }
    const iso2=COUNTRY_ISO2[country]||'', iso3=COUNTRY_ISO[country]||'';
    ov.setStatus(tr('Researching '+country+' across World Bank · WHO · UNICEF · UNESCO · FAO · JMP · ITU · IEA · OCHA and national sources, then filling the 23-slide ODA template. This takes roughly 15–25 minutes — keep this tab open.',
      'جارٍ البحث عن '+cN(country)+' في مصادر البنك الدولي ومنظمة الصحة واليونيسف واليونسكو والفاو وغيرها، ثم تعبئة قالب المكتب المكوّن من 23 شريحة. يستغرق ذلك نحو 15–25 دقيقة — أبقِ هذه الصفحة مفتوحة.'));
    const res=await fetch(base+'/country_report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country,iso2,iso3})});
    const j=await res.json().catch(()=>({ok:false,error:'HTTP '+res.status}));
    if(!res.ok||!j.ok) throw new Error(j.error||('HTTP '+res.status));
    const fileName=String(j.file||'').split(/[\\/]/).pop();
    await repSave({ id:repId(), kind:'ai', title:country+' — Full AI report (23 slides)', countries:[country], createdAt:new Date().toISOString(),
      fileName, size:null, data:'ai', blob:null, location:'Downloads folder on the server computer', lang:'en' });
    ov.remove(); onReportsChanged(); loadReportsManifest();
    if(!quiet) alert(tr('✓ Full AI report saved to Downloads on the server computer:\n\n', '✓ تم حفظ تقرير الذكاء الاصطناعي في مجلد التنزيلات على جهاز الخادم:\n\n')+fileName);
    return true;
  }catch(e){ ov.remove(); console.error('[CAD] Full AI report failed:',e); if(!quiet) alert(tr('Full AI report failed: ', 'تعذّر إعداد تقرير الذكاء الاصطناعي: ')+(e.message||e)+tr('\n\nCheck the server log (_score_server.log).', '\n\nراجع سجل الخادم (_score_server.log).')); return false; }
}

// ── Country Analysis ──────────────────────────────────────────────────────
function ca_getIso(country) {
  return COUNTRY_ISO[country] || country.substring(0, 3).toUpperCase();
}

async function ca_fetchIndicator(iso, indicatorId) {
  try {
    const url = `https://api.worldbank.org/v2/country/${iso}/indicator/${indicatorId}?format=json&mrv=5&per_page=5`;
    const resp = await Promise.race([fetch(url), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data || !data[1] || !data[1].length) return null;
    for (const row of data[1]) {
      if (row.value !== null && row.value !== undefined) {
        return { value: row.value, year: row.date };
      }
    }
    return null;
  } catch(e) { return null; }
}

// Static snapshot baked by build_indicators.py (docs/data/indicators.json).
// Loaded once at startup; serves indicator data instantly and works offline / in
// restricted networks. A live background refresh (when reachable) overwrites it
// with fresher values. This is the "A+ Hybrid" data strategy.
let prebakedIndicators = {};
let prebakedLoaded = false;
let _prebakedPromise = null;
let SNAPSHOT_DATE = null;   // when the snapshot was generated (indicators.json _meta)

function loadPrebakedIndicators() {
  if (_prebakedPromise) return _prebakedPromise;
  _prebakedPromise = (async () => {
    try {
      const resp = await fetch('data/indicators.json', { cache: 'no-cache' });
      if (resp.ok) {
        const json = await resp.json();
        SNAPSHOT_DATE = json._meta && json._meta.generated;
        delete json._meta;
        if (json._regions) REGION_MEMBERS = json._regions;   // {region: [countries]} for the report selector
        delete json._regions;
        prebakedIndicators = json;
      }
    } catch (e) { /* no snapshot reachable — live fetch will cover */ }
    prebakedLoaded = true;
    NEED_CACHE = null;
    colorMapPins();
  })();
  return _prebakedPromise;
}

function ca_rerenderIfOpen(country) {
  // Re-render country drawer overview/indicators if the drawer is open for this country
  if (cdCountry === country && document.getElementById('drawer')?.classList.contains('open')) {
    if (cdActiveTab === 'overview') cdRenderOverview();
    else if (cdActiveTab === 'indicators') cdRenderIndicators();
  }
}

async function ca_loadCountryData(country) {
  // Make sure the baked snapshot is available before we decide how to seed.
  if (!prebakedLoaded) await loadPrebakedIndicators();

  // Already resolved this session (baked or live) → done.
  const existing = countryDataCache[country];
  if (existing && !existing.__loading &&
      Object.keys(existing).filter(k => !k.startsWith('__')).length > 0) return;

  // 1) Seed instantly from the baked snapshot, if present.
  const baked = prebakedIndicators[country];
  const hasBaked = baked && Object.keys(baked).length > 0;
  if (hasBaked) {
    countryDataCache[country] = { ...baked, __source: 'baked' };
  } else {
    countryDataCache[country] = { __loading: true };
  }
  ca_rerenderIfOpen(country);

  // 2) Live background refresh — failures are silent; baked data is kept.
  const iso = ca_getIso(country);
  const allIds = new Set();
  for (const tab of CA_TABS) {
    for (const ind of CA_INDICATORS[tab] || []) {
      if (/^[A-Z]/.test(ind.id) && !ind.id.startsWith('IMF.')) allIds.add(ind.id);   // World Bank ids only (uis:, IMF. and __ cards come from saved files)
    }
  }

  const results = {};
  await Promise.all([...allIds].map(async id => {
    const res = await ca_fetchIndicator(iso, id);
    if (res) results[id] = res;
  }));

  if (Object.keys(results).length > 0) {
    // Live wins where present; keep baked values for anything the API dropped.
    countryDataCache[country] = { ...(baked || {}), ...results, __source: 'live' };
  } else if (!hasBaked) {
    // No live data and no baked data → mark done so the UI shows "—", not a spinner.
    countryDataCache[country] = { __loaded: true };
  }
  // else: live empty but baked present → keep the baked cache already set.

  ca_rerenderIfOpen(country);
}

function ca_formatValue(raw, ind) {
  if (!raw || raw.value === null || raw.value === undefined) return '—';
  const v = raw.value;
  const U = { T: tr('T', ' ترليون'), B: tr('B', ' مليار'), M: tr('M', ' مليون'), K: tr('K', ' ألف') };
  switch (ind.fmt) {
    case 'pct1': return v.toFixed(1);
    case 'num0': return Number(v.toFixed(0)).toLocaleString('en-US');
    case 'num1': return v.toFixed(1);
    case 'num2': return v.toFixed(2);
    case 'big': {
      if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + U.T;
      if (v >= 1e9)  return '$' + (v / 1e9).toFixed(1)  + U.B;
      if (v >= 1e6)  return '$' + (v / 1e6).toFixed(1)  + U.M;
      return '$' + Number(v.toFixed(0)).toLocaleString('en-US');
    }
    case 'pop': {
      if (v >= 1e9) return (v / 1e9).toFixed(2) + U.B;
      if (v >= 1e6) return (v / 1e6).toFixed(1) + U.M;
      if (v >= 1e3) return (v / 1e3).toFixed(0) + U.K;
      return Number(v.toFixed(0)).toLocaleString('en-US');
    }
    default: return v.toFixed(1);
  }
}
