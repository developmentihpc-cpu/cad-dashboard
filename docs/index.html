.ex-title { font-family:'Lora',Georgia,serif; font-size:30px; font-weight:700; color:var(--ex-ink); margin-top:6px; line-height:1.15; }
.ex-rule { width:56px; height:3px; background:var(--ex-gold); margin:12px 0 12px; }
.ex-summary { font-size:15px; color:var(--ex-mute); line-height:1.55; max-width:720px; }
.ex-summary strong { color:var(--ex-ink); }
.ex-hero-actions { display:flex; gap:8px; align-items:center; }
.ex-date { font-size:12px; color:var(--ex-mute); margin-right:6px; }
.ex-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font:600 12px 'Inter',sans-serif; cursor:pointer; border:1px solid var(--ex-sky); background:#fff; color:var(--ex-sky-dk); transition:background .15s; }
.ex-btn:hover { background:var(--ex-sky-pale); }
.ex-btn.primary { background:var(--ex-sky-dk); border-color:var(--ex-sky-dk); color:#fff; }
.ex-btn.primary:hover { background:#155C8D; }

.ex-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:24px 0 28px; }
.ex-kpi { background:#fff; border:1px solid var(--ex-line); border-top:3px solid var(--ex-sky); border-radius:10px; padding:16px 18px; }
.ex-kpi.gold { border-top-color:var(--ex-gold); }
.ex-kpi-label { font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--ex-mute); }
.ex-kpi-val { font-size:32px; font-weight:800; color:var(--ex-ink); margin-top:6px; line-height:1; font-variant-numeric:tabular-nums; }
.ex-kpi-sub { font-size:12px; color:var(--ex-mute); margin-top:6px; }

.ex-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px; margin-bottom:20px; }
.ex-card { background:#fff; border:1px solid var(--ex-line); border-radius:12px; padding:18px 20px; }
.ex-card-hd { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:14px; }
.ex-card-title { font-family:'Lora',Georgia,serif; font-size:17px; font-weight:700; color:var(--ex-ink); }
.ex-card-note { font-size:12px; color:var(--ex-mute); }
.ex-empty { font-size:13px; color:var(--ex-mute); padding:10px 0; }

.ex-dec { display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--ex-line); border-left:3px solid var(--ex-gold); border-radius:8px; margin-bottom:10px; cursor:pointer; transition:background .15s; }
.ex-dec:hover { background:var(--ex-gold-lt); }
.ex-dec-main { flex:1; min-width:0; }
.ex-dec-title { font-size:14px; font-weight:700; color:var(--ex-ink); }
.ex-dec-meta { font-size:12px; color:var(--ex-mute); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.ex-dec-verdict { font-size:11px; font-weight:600; color:#7A5A12; background:var(--ex-gold-lt); border-radius:4px; padding:1px 6px; }
.ex-dec-cost { font-size:16px; font-weight:800; color:var(--ex-ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
.ex-tag { font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:3px 8px; border-radius:20px; white-space:nowrap; }
.ex-tag.lead { background:var(--ex-gold-lt); color:#7A5A12; }
.ex-tag.stake { background:var(--ex-sky-lt); color:var(--ex-sky-dk); }

.ex-stage { display:grid; grid-template-columns:130px 1fr 74px; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; }
.ex-stage-name { color:var(--ex-ink); font-weight:500; }
.ex-stage-track { height:22px; background:var(--ex-sky-pale); border-radius:4px; overflow:hidden; }
.ex-stage-fill { height:100%; background:var(--ex-sky); border-radius:4px; display:flex; align-items:center; padding-left:8px; color:#fff; font-size:11px; font-weight:700; min-width:0; }
.ex-stage-fill.gold { background:var(--ex-gold); }

// ── View switching ────────────────────────────────────────────────────────
// Views: executive (landing) · reports · evaluation · countries (map)
function switchView(view, navEl) {
  const target = document.getElementById('view-' + view);
  if (!target) return;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  target.classList.add('active');

  document.querySelectorAll('.sb-icon[data-view]').forEach(el => el.classList.remove('active'));
  const nav = navEl || document.querySelector('.sb-icon[data-view="' + view + '"]');
  if (nav) nav.classList.add('active');

  if (view === 'countries' && map) setTimeout(() => map.invalidateSize(), 120);
  if (view === 'executive') renderExecutive();
  if (view === 'reports')   renderReports();
  if (view === 'evaluation') {
    const f = document.getElementById('evaluator-frame');
    if (f && !f.src) f.src = 'evaluator.html?v=' + Date.now();   // lazy-load fresh (cache-bust)
  }
  // Remember the active view so a refresh returns here
  try { localStorage.setItem('cad_view', view); } catch (e) {}
}

function restoreView() {
  // Executive View is the landing page. A link ending in #executive always opens it;
  // otherwise a returning user goes back to the view they were last on.
  const landing = () => goView('executive');
  try {
    if (location.hash === '#executive') return landing();
    const v = localStorage.getItem('cad_view');
    if (v && v !== 'executive' && document.querySelector('.sb-icon[data-view="' + v + '"]')) goView(v);
    else landing();
  } catch (e) { landing(); }
}


function flagImg(countryEn, w, h) {
  w = w||16; h = h||11;
  if (CUSTOM_FLAGS[countryEn]) {
    return `<img src="${CUSTOM_FLAGS[countryEn]}" style="width:${w}px;height:${h}px;object-fit:cover;border-radius:2px;vertical-align:middle;flex-shrink:0;display:inline-block" alt="${countryEn}">`;
  }
  const iso2 = (COUNTRY_ISO2[countryEn]||'').toLowerCase();
  if(!iso2) return '';
  return `<img src="https://flagcdn.com/w20/${iso2}.png" style="width:${w}px;height:${h}px;object-fit:cover;border-radius:2px;vertical-align:middle;flex-shrink:0;display:inline-block" onerror="this.style.display='none'">`;

function relTime(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// ── Map ───────────────────────────────────────────────────────────────────
function initMap() {
  if (mapInitialized) return;
  mapInitialized = true;
  map = L.map('map', { zoomControl:false, attributionControl:false }).setView([12,25],3);
  // Esri light-gray canvas — free, no API key. Clean Positron-style look.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom:12, attribution:'Tiles © Esri' }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom:12, opacity:0.75 }).addTo(map);
  L.control.zoom({ position:'bottomright' }).addTo(map);

  // Plot every country in the catalogue; colour comes from the need index (colorMapPins)
  Object.entries(COUNTRY_LATLNG).forEach(([country, [lat, lng]]) => {
    const el = document.createElement('div');
    el.className = 'map-pin';
    el.title = country;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.map-pin').forEach(m => m.classList.remove('sel'));
      el.classList.add('sel');
      openCountryDrawer(country);
    });
    const marker = L.marker([lat, lng], {
      icon: L.divIcon({ html: el, className: '', iconSize: [12, 12], iconAnchor: [6, 6] })
    }).addTo(map);
    mapMarkers[country] = { marker, el };
  });
  const jump = document.getElementById('map-jump');
  if (jump) jump.innerHTML = '<option value="">Go to country…</option>' +
    Object.keys(COUNTRY_LATLNG).sort().map(c => `<option value="${exEsc(c)}">${exEsc(c)}</option>`).join('');
  colorMapPins();
}

// Shade pins by need index: top third = high, middle = medium, rest = lower.
function colorMapPins() {
  if (!mapInitialized || !prebakedLoaded) return;
  const need = needScores(), ranked = need.__ranked || [];
  const n = ranked.length;
  Object.entries(mapMarkers).forEach(([c, { el }]) => {
    el.classList.remove('need-hi', 'need-mid', 'need-lo');
    const r = need[c] && need[c].rank;
    if (r) el.classList.add(r <= n / 3 ? 'need-hi' : r <= 2 * n / 3 ? 'need-mid' : 'need-lo');
    el.title = c + (r ? ' · need index ' + Math.round(need[c].need) + ' (rank ' + r + ' of ' + n + ')' : '');
  });
}

function mapJumpTo(country) {
  if (!country) return;
  const mk = mapMarkers[country];
  document.querySelectorAll('.map-pin').forEach(m => m.classList.remove('sel'));
  if (mk) { mk.el.classList.add('sel'); if (map) map.setView(mk.marker.getLatLng(), 4); }
  openCountryDrawer(country);
}

// ── Country Drawer ────────────────────────────────────────────────────────
function openCountryDrawer(country) {
  cdCountry = country;
  cdActiveTab = 'overview';
  cdActiveIndTab = 'overview';
  const need = needScores()[country] || {};
  const inc = { LIC:'Low income', LMIC:'Lower-middle income', UMIC:'Upper-middle income' }[COUNTRY_INCOME[country]] || '';
  document.getElementById('drawer-title').textContent = country;
  document.getElementById('drawer-sub').textContent =
    [repRegionOf(country), inc, need.rank ? 'Need index ' + Math.round(need.need) + ' · rank ' + need.rank + ' of ' + (needScores().__ranked || []).length : ''].filter(Boolean).join(' · ') || '—';

  // Reset main tabs
  document.querySelectorAll('#cd-main-tabs .dtab').forEach(b => b.classList.remove('active'));
  document.getElementById('cd-tab-overview').classList.add('active');

  // Kick off data fetch in background (snapshot first, then live refresh)
  if (country) ca_loadCountryData(country);

  cdRenderOverview();
  document.getElementById('drawer').classList.add('open');
}

function cdSwitchTab(tab, btn) {
  cdActiveTab = tab;
  document.querySelectorAll('#cd-main-tabs .dtab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (tab === 'overview')        cdRenderOverview();
  else if (tab === 'indicators') cdRenderIndicators();
}

function cdRenderOverview() {
  if (!cdCountry) return;
  const iso = ca_getIso(cdCountry);
  const data = countryDataCache[cdCountry] || {};
  const loading = !data || data.__loading || Object.keys(data).length === 0;

  // Key overview indicators to show
  const keyInds = [
    { id:'SP.POP.TOTL',       label:'Population',         fmt:'pop',  unit:'' },
    { id:'NY.GDP.PCAP.PP.CD', label:'GDP/Capita PPP',     fmt:'num0', unit:' USD' },
    { id:'NY.GDP.MKTP.KD.ZG', label:'GDP Growth',         fmt:'pct1', unit:'%' },
    { id:'SP.DYN.LE00.IN',    label:'Life Expectancy',    fmt:'num1', unit:' yrs' },
    { id:'SH.DYN.MORT',       label:'Under-5 Mortality',  fmt:'num0', unit:' /1k' },
    { id:'SN.ITK.DEFC.ZS',    label:'Undernourishment',   fmt:'pct1', unit:'%' },
    { id:'SH.H2O.BASW.ZS',    label:'Basic Water Access', fmt:'pct1', unit:'%' },
    { id:'EG.ELC.ACCS.ZS',    label:'Electricity Access', fmt:'pct1', unit:'%' },
  ];
  const statsHtml = keyInds.map(ind => {
    const raw = data[ind.id];
    const hasVal = !loading && raw && raw.value !== null;
    const val = hasVal ? ca_formatValue(raw, ind) : (loading ? '…' : '—');
    const srcUrl = `https://data.worldbank.org/indicator/${ind.id}?locations=${iso}`;
    return `<div class="cd-stat-card">
      <div class="cd-stat-label">${ind.label}</div>
      <div class="cd-stat-val ${loading ? 'cd-stat-loading' : ''}">${val}<span class="cd-stat-unit">${hasVal ? ind.unit : ''}</span></div>
      ${hasVal ? `<div class="cd-stat-year">${raw.year}</div>` : ''}
      <div class="cd-stat-src"><a href="${srcUrl}" target="_blank">World Bank</a></div>
    </div>`;
  }).join('');
  const srcLabel = data.__source === 'live' ? 'Live from World Bank' : data.__source === 'baked' ? 'Snapshot · refreshing live…' : '';

  // Reports for this country: saved in this browser + published on the website
  const mine = REP_LIBRARY.filter(r => r.countries.includes(cdCountry)).slice(0, 6);
  const repsHtml = repLibRowsHtml(mine, true) + repPublishedHtml(cdCountry);

  document.getElementById('drawer-body').innerHTML = `
    <div class="cd-section">
      <div class="cd-section-hd">
        <div class="cd-section-title">Key Indicators <span style="font-weight:500;color:var(--text3);font-size:11px;margin-left:6px">${srcLabel}</span></div>
        ${loading ? `<span class="cd-stat-loading">Loading…</span>` : `<a href="https://data.worldbank.org/country/${iso}" target="_blank" style="font-size:10px;color:var(--accent);text-decoration:none">World Bank profile →</a>`}
      </div>
      <div class="cd-stat-grid">${statsHtml}</div>
    </div>
    <div class="cd-section cd-reports">
      <div class="cd-section-hd">
        <div class="cd-section-title">Reports for ${exEsc(cdCountry)}</div>
        <span class="cd-section-count">${mine.length + (REPORTS_MANIFEST[cdCountry] ? 1 : 0)}</span>
      </div>
      ${repsHtml || '<div class="cd-empty-country">No reports yet. Use Instant report above.</div>'}
    </div>`;
}

function cdRenderIndicators() {
  if (!cdCountry) return;
  const data = countryDataCache[cdCountry] || {};
  const loading = !data || data.__loading || Object.keys(data).length === 0;

  const tabsHtml = CA_TABS.map(tab => {
    const label = (CA_TAB_LABELS[lang] || CA_TAB_LABELS.en)[tab];
    return `<button class="cd-itab ${cdActiveIndTab === tab ? 'active' : ''}" onclick="cdSwitchIndTab('${tab}',this)">${label}</button>`;
  }).join('');

  const bodyContent = loading
    ? `<div class="ca-loading"><div class="ca-spinner"></div><span>${lang==='ar'?'جارٍ تحميل البيانات...':'Loading data…'}</span></div>`
    : cdBuildIndGrid(cdActiveIndTab);

  document.getElementById('drawer-body').innerHTML = `
    <div class="cd-ind-wrap">
      <div class="cd-ind-tabs-wrap"><div class="cd-ind-tabs">${tabsHtml}</div></div>
      <div class="cd-ind-body" id="cd-ind-body">${bodyContent}</div>
    </div>`;
}

function cdSwitchIndTab(key, btn) {
  cdActiveIndTab = key;
  document.querySelectorAll('.cd-itab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const body = document.getElementById('cd-ind-body');
  if (body) body.innerHTML = cdBuildIndGrid(key);
}

function cdBuildIndGrid(tabKey) {
  const inds = CA_INDICATORS[tabKey] || [];
  const data = countryDataCache[cdCountry] || {};
  const iso  = ca_getIso(cdCountry);
  const oecUrl = `https://oec.world/en/profile/country/${iso.toLowerCase()}`;

  const cards = inds.map(ind => {
    const label = lang === 'ar' ? ind.labelAr : ind.label;
    if (ind.id.startsWith('__')) {
      const linkText = lang === 'ar'
        ? (ind.id === '__oec_exports' ? 'شركاء التصدير →' : 'شركاء الاستيراد →')
        : (ind.id === '__oec_exports' ? 'Export partners →' : 'Import partners →');
      return `<div class="ca-ind-card ca-oec-card">
        <div class="ca-ind-label">${label}</div>
        <div class="ca-ind-oec-link"><a href="${oecUrl}" target="_blank" class="ca-src-link ca-src-link-big">${linkText}</a></div>
        <div class="ca-ind-src"><a href="${oecUrl}" target="_blank" class="ca-src-link">OEC</a></div>
      </div>`;
    }
    const raw = data[ind.id];
    const hasVal = raw && raw.value !== null && raw.value !== undefined;
    const val  = hasVal ? ca_formatValue(raw, ind) : '—';
    const year = hasVal ? raw.year : '';
    const srcUrl = `https://data.worldbank.org/indicator/${ind.id}?locations=${iso}`;
    return `<div class="ca-ind-card ${!hasVal ? 'ca-no-data' : ''}">
      <div class="ca-ind-label">${label}</div>
      <div class="ca-ind-val">${val}${hasVal ? '<span class="ca-ind-unit">' + ind.unit + '</span>' : ''}</div>
      ${year ? `<div class="ca-ind-year">${year}</div>` : ''}
      <div class="ca-ind-src"><a href="${srcUrl}" target="_blank" class="ca-src-link">World Bank</a></div>
    </div>`;
  }).join('');

  return `<div class="cd-ind-grid">${cards}</div>`;
}


function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');

}

async function loadReportsManifest() {

// ── Small helpers ─────────────────────────────────────────────────────────
function exEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}
const qa = s => exEsc(JSON.stringify(s));   // safe JS string argument inside an onclick="…"
function goView(v) { const n = document.querySelector('.sb-icon[data-view="' + v + '"]'); switchView(v, n); }
function repAllCountries() {
  const keys = Object.keys(prebakedIndicators || {});
  return (keys.length ? keys : Object.keys(COUNTRY_INCOME)).sort();
}
function repRegionOf(country) {
  for (const [r, list] of Object.entries(REGION_MEMBERS || {})) if (list.includes(country)) return r;
  return '';
}
function repFileSafe(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w\-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, ''); }
function repStamp() { return new Date().toISOString().slice(0, 10); }
function repId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function repFmtSize(b) { return b == null ? '—' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function repFmtDate(iso) { try { return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) + ' · ' + new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); } catch (e) { return iso || ''; } }
function repFmtPeople(n) { return n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? Math.round(n / 1e6) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(Math.round(n)); }
function repDownloadBlob(blob, fileName) {

// ── Saved reports library (IndexedDB — this browser only) ────────────────
const RepStore = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('cad_reports', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('reports', { keyPath: 'id' });
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      } catch (e) { rej(e); }
    });
    return this._db;
  },
  async _req(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('reports', mode);
      const rq = fn(t.objectStore('reports'));
      t.oncomplete = () => res(rq.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  put(rec) { return this._req('readwrite', s => s.put(rec)); },
  get(id)  { return this._req('readonly',  s => s.get(id)); },
  del(id)  { return this._req('readwrite', s => s.delete(id)); },
  async all() { try { return (await this._req('readonly', s => s.getAll())) || []; } catch (e) { return []; } },
};
let REP_LIBRARY = [];   // newest first; refreshed by onReportsChanged()
async function repSave(rec) {
  try { await RepStore.put(rec); return true; }
  catch (e) { console.warn('[CAD] Could not save report in this browser:', e); return false; }
}
async function repLibDownload(id) {
  const rec = await RepStore.get(id).catch(() => null);
  if (rec && rec.blob) repDownloadBlob(rec.blob, rec.fileName);
}
async function repLibDelete(id) {
  const rec = REP_LIBRARY.find(r => r.id === id);
  if (!confirm('Remove "' + (rec ? rec.title : 'this report') + '" from the saved reports in this browser?')) return;
  await RepStore.del(id).catch(() => {});
  onReportsChanged();
}
async function onReportsChanged() {
  REP_LIBRARY = (await RepStore.all()).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const active = (document.querySelector('.view.active') || {}).id;
  if (active === 'view-executive') renderExecutive();
  if (active === 'view-reports') repRenderLibrary();
  if (cdCountry && document.getElementById('drawer').classList.contains('open') && cdActiveTab === 'overview') cdRenderOverview();
}

// ── Need index (from the World Bank snapshot, so rankings are stable) ─────
const NEED_INDS = [
  { id:'SH.DYN.MORT',    dir: 1, label:'Under-5 mortality',     sector:'Health' },
  { id:'SH.STA.MMRT',    dir: 1, label:'Maternal mortality',    sector:'Health' },
  { id:'SN.ITK.DEFC.ZS', dir: 1, label:'Undernourishment',      sector:'Food security' },
  { id:'SH.H2O.BASW.ZS', dir:-1, label:'Basic drinking water',  sector:'WASH' },
  { id:'SH.STA.BASS.ZS', dir:-1, label:'Basic sanitation',      sector:'WASH' },
  { id:'EG.ELC.ACCS.ZS', dir:-1, label:'Electricity access',    sector:'Energy' },
];
let NEED_CACHE = null;
function needScores() {
  if (NEED_CACHE) return NEED_CACHE;
  const names = Object.keys(prebakedIndicators || {});
  if (!names.length) return {};
  const val = (c, id) => { const d = (prebakedIndicators[c] || {})[id]; return d && d.value != null ? d.value : null; };
  const rng = {};
  NEED_INDS.forEach(ind => {
    const vs = names.map(c => val(c, ind.id)).filter(v => v != null);
    rng[ind.id] = [Math.min(...vs), Math.max(...vs)];
  });
  const out = {};
  names.forEach(c => {
    const parts = {};
    NEED_INDS.forEach(ind => {
      const v = val(c, ind.id); if (v == null) return;
      const [lo, hi] = rng[ind.id]; if (hi === lo) return;
      parts[ind.id] = ind.dir > 0 ? (v - lo) / (hi - lo) * 100 : (hi - v) / (hi - lo) * 100;
    });
    const ks = Object.keys(parts);
    const need = ks.length >= 4 ? ks.reduce((s, k) => s + parts[k], 0) / ks.length : null;
    const worst = ks.sort((a, b) => parts[b] - parts[a])[0];
    out[c] = { need, parts, worst: worst ? NEED_INDS.find(i => i.id === worst) : null };
  });
  const ranked = names.filter(c => out[c].need != null).sort((a, b) => out[b].need - out[a].need);
  ranked.forEach((c, i) => out[c].rank = i + 1);
  out.__ranked = ranked;
  NEED_CACHE = out;
  return out;
}

async function repCountryData(country, ms = 20000) {
  await Promise.race([ca_loadCountryData(country), new Promise(r => setTimeout(r, ms))]);
  return countryDataCache[country] || {};
}
async function repFetchDataUrl(url, ms) {
  const r = await Promise.race([fetch(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const b = await r.blob();
  return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
}
async function repFlag(country) {
  try {
    if (CUSTOM_FLAGS[country]) return await repFetchDataUrl(CUSTOM_FLAGS[country], 4000);
    const iso2 = (COUNTRY_ISO2[country] || '').toLowerCase();
    return iso2 ? await repFetchDataUrl(`https://flagcdn.com/w160/${iso2}.png`, 4000) : null;
  } catch (e) { return null; }
}
// Locator map for the cover: Esri light-grey basemap (no key) with a gold ring on the country.
async function repMap(country) {
  const ll = COUNTRY_LATLNG[country]; if (!ll) return null;
  const [lat, lng] = ll, dx = 10, dy = 7;
  const W = 900, H = 600;
  const url = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/export'
    + `?bbox=${lng - dx},${lat - dy},${lng + dx},${lat + dy}&bboxSR=4326&imageSR=3857&size=${W},${H}&format=jpg&f=image`;
  try {
    const src = await repFetchDataUrl(url, 7000);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
    // centre point in the (Mercator) image — the requested box is stretched to the image size
    const merc = la => Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360));
    const fy = (merc(lat + dy) - merc(lat)) / (merc(lat + dy) - merc(lat - dy));
    const cx = img.width / 2, cy = img.height * fy;
    g.strokeStyle = '#AD833B'; g.lineWidth = 6; g.beginPath(); g.arc(cx, cy, 34, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#AD833B'; g.beginPath(); g.arc(cx, cy, 8, 0, Math.PI * 2); g.fill();
    return cv.toDataURL('image/jpeg', 0.88);
  } catch (e) { return null; }
}
// Live headline indicators for many countries at once — one World Bank call per indicator.
async function repRegionLive(countries, ids) {
  const isoToName = {}, isos = [];
  countries.forEach(c => { const iso = COUNTRY_ISO[c]; if (iso) { isoToName[iso] = c; isos.push(iso); } });
  const out = {}; let ok = 0;
  await Promise.all(ids.map(async id => {
    try {
      const url = `https://api.worldbank.org/v2/country/${isos.join(';')}/indicator/${id}?format=json&mrv=5&per_page=5000`;
      const r = await Promise.race([fetch(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000))]);   // the WB API can take 10s+
      if (!r.ok) return;
      const j = await r.json(); if (!j || !j[1]) return;
      ok++;
      j[1].forEach(row => {
        const c = isoToName[row.countryiso3code]; if (!c || row.value == null) return;
        out[c] = out[c] || {};
        const cur = out[c][id];
        if (!cur || Number(row.date) > Number(cur.year)) out[c][id] = { value: row.value, year: row.date };
      });
    } catch (e) { /* keep snapshot values */ }
  }));
  return { data: out, live: ok > 0 };
}
function repDateStr() { return new Date().toLocaleDateString('en-US', { month:'long', year:'numeric' }); }
function repSnapshotStr() {
  try { return SNAPSHOT_DATE ? new Date(SNAPSHOT_DATE).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : ''; } catch (e) { return ''; }
}
function repLibsReady() {
  if (typeof PptxGenJS === 'undefined' || typeof window.buildCountryDeck !== 'function' || typeof window.buildRegionDeck !== 'function')
    throw new Error('The report library did not load. Please refresh the page and try again.');
}

async function repBuildCountryBlob(country, setStatus) {
  repLibsReady();

  const d = await repCountryData(country);

}

async function repRunBatch(countries) {
  countries = [...new Set(countries)].filter(Boolean);
  if (!countries.length) { alert('Select at least one country first.'); return; }
  if (countries.length > 10 && !confirm('Build ' + countries.length + ' separate reports? Each takes a few seconds, and your browser may ask once to allow several downloads.')) return;
  const ov = cd_progressOverlay('Building ' + countries.length + ' country reports', 'Starting…');
  const failed = [];
  for (let i = 0; i < countries.length; i++) {
    const c = countries[i];
    try {
      const { blob, data } = await repBuildCountryBlob(c, s => ov.setStatus((i + 1) + ' of ' + countries.length + ' · ' + s));
      const fileName = repFileSafe(c) + '_Country_Assessment_' + repStamp() + '.pptx';
      await repSave({ id: repId(), kind: 'single', title: c + ' — Country Assessment', countries: [c],
        createdAt: new Date().toISOString(), fileName, size: blob.size, data, blob, batch: true });
      repDownloadBlob(blob, fileName);
      await new Promise(r => setTimeout(r, 400));   // space out downloads so the browser keeps them all
    } catch (e) { failed.push(c); }
  }
  ov.remove();
  onReportsChanged();
  repToast('✓ ' + (countries.length - failed.length) + ' of ' + countries.length + ' reports built and saved');
  if (failed.length) alert('These reports could not be built: ' + failed.join(', ') + '. Please try them again.');
}

async function repRunRegion(region) {
  const members = (REGION_MEMBERS[region] || []).slice();
  if (!members.length) { alert('No countries found for ' + region + '.'); return; }
  const ov = cd_progressOverlay('Region report · ' + region, 'Loading live World Bank data for ' + members.length + ' countries — this can take up to 30 seconds…');
  try {
    repLibsReady();
    if (!prebakedLoaded) await loadPrebakedIndicators();
    const ids = ['SP.POP.TOTL', 'NY.GDP.PCAP.PP.CD', ...NEED_INDS.map(i => i.id)];
    const live = await repRegionLive(members, ids);
    ov.setStatus('Fetching flags and building the ' + region + ' report…');
    const need = needScores();
    const flags = await Promise.all(members.map(repFlag));
    const countries = members.map((c, i) => ({
      name: c, iso2: COUNTRY_ISO2[c] || '', income: COUNTRY_INCOME[c] || '', flagData: flags[i],
      need: need[c] ? need[c].need : null, needRank: null,
      data: { ...(prebakedIndicators[c] || {}), ...(live.data[c] || {}) },
    }));
    countries.filter(c => c.need != null).sort((a, b) => b.need - a.need).forEach((c, i) => c.needRank = i + 1);
    const dataNote = live.live
      ? 'Headline indicators were retrieved live from the World Bank API when this report was built.'
      : 'Figures come from the dashboard’s World Bank snapshot' + (repSnapshotStr() ? ' of ' + repSnapshotStr() : '') + ' (the live API could not be reached).';
    const blob = await window.buildRegionDeck({ region, countries, dateStr: repDateStr(), dataNote, PptxGenJS, output: 'blob' });
    const fileName = repFileSafe(region) + '_Regional_Assessment_' + repStamp() + '.pptx';
    const saved = await repSave({ id: repId(), kind: 'region', title: region + ' — Regional Assessment', countries: members,
      createdAt: new Date().toISOString(), fileName, size: blob.size, data: live.live ? 'live' : 'snapshot', blob });
    repDownloadBlob(blob, fileName);
    ov.remove();
    repToast(saved ? '✓ ' + region + ' report downloaded and saved to your reports' : '✓ ' + region + ' report downloaded');
    onReportsChanged();
  } catch (e) { ov.remove(); alert('The region report could not be built: ' + (e.message || e)); }
}

// Full AI report — live AI deep-research country deck via the local research server (localhost only).
// Fills the exact 23-slide ODA country-proposal template through the server's /country_report
// pipeline; long-running, and the file is saved to Downloads on the server computer. A record of
// it is added to the saved-reports library. Returns true on success.
async function cd_generateAICountryDeck(country, label, quiet){
  const base=repServerBase();
  const ov=cd_progressOverlay('Full AI report · '+country+(label?' ('+label+')':''),'Checking the local research server…');
  try{
    let up=false;
    try{ const h=await fetch(base+'/health',{method:'GET'}); const hj=await h.json(); up=!!(hj&&hj.ok&&hj.key); }catch(e){}
    if(!up){ ov.remove(); alert(REP_AI_HELP); return false; }
    const iso2=COUNTRY_ISO2[country]||'', iso3=COUNTRY_ISO[country]||'';
    ov.setStatus('Researching '+country+' across World Bank · WHO · UNICEF · UNESCO · FAO · JMP · ITU · IEA · OCHA and national sources, then filling the 23-slide ODA template. This takes roughly 15–25 minutes — keep this tab open.');
    const res=await fetch(base+'/country_report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country,iso2,iso3})});
    const j=await res.json().catch(()=>({ok:false,error:'HTTP '+res.status}));
    if(!res.ok||!j.ok) throw new Error(j.error||('HTTP '+res.status));
    const fileName=String(j.file||'').split(/[\/]/).pop();
    await repSave({ id:repId(), kind:'ai', title:country+' — Full AI report (23 slides)', countries:[country], createdAt:new Date().toISOString(),
      fileName, size:null, data:'ai', blob:null, location:'Downloads folder on the server computer' });
    ov.remove(); onReportsChanged(); loadReportsManifest();
    if(!quiet) alert('✓ Full AI report saved to Downloads on the server computer:\n\n'+fileName);
    return true;
  }catch(e){ ov.remove(); console.error('[CAD] Full AI report failed:',e); if(!quiet) alert('Full AI report failed: '+(e.message||e)+'\n\nCheck the server log (_score_server.log).'); return false; }
}

// ── Country Analysis ──────────────────────────────────────────────────────
function ca_getIso(country) {
  return COUNTRY_ISO[country] || country.substring(0, 3).toUpperCase();
}

async function ca_fetchIndicator(iso, indicatorId) {
  try {
    const url = `https://api.worldbank.org/v2/country/${iso}/indicator/${indicatorId}?format=json&mrv=5&per_page=5`;
    const resp = await Promise.race([fetch(url), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data || !data[1] || !data[1].length) return null;
    for (const row of data[1]) {
      if (row.value !== null && row.value !== undefined) {
        return { value: row.value, year: row.date };
      }
    }
    return null;
  } catch(e) { return null; }
}

// Static snapshot baked by build_indicators.py (docs/data/indicators.json).
// Loaded once at startup; serves indicator data instantly and works offline / in
// restricted networks. A live background refresh (when reachable) overwrites it
// with fresher values. This is the "A+ Hybrid" data strategy.
let prebakedIndicators = {};
let prebakedLoaded = false;
let _prebakedPromise = null;
let SNAPSHOT_DATE = null;   // when the snapshot was generated (indicators.json _meta)

function loadPrebakedIndicators() {
  if (_prebakedPromise) return _prebakedPromise;
  _prebakedPromise = (async () => {
    try {
      const resp = await fetch('data/indicators.json', { cache: 'no-cache' });
      if (resp.ok) {
        const json = await resp.json();
        SNAPSHOT_DATE = json._meta && json._meta.generated;
        delete json._meta;
        if (json._regions) REGION_MEMBERS = json._regions;   // {region: [countries]} for the report selector
        delete json._regions;
        prebakedIndicators = json;
      }
    } catch (e) { /* no snapshot reachable — live fetch will cover */ }
    prebakedLoaded = true;
    NEED_CACHE = null;
    colorMapPins();
  })();
  return _prebakedPromise;
}

function ca_rerenderIfOpen(country) {
  // Re-render country drawer overview/indicators if the drawer is open for this country
  if (cdCountry === country && document.getElementById('drawer')?.classList.contains('open')) {
    if (cdActiveTab === 'overview') cdRenderOverview();
    else if (cdActiveTab === 'indicators') cdRenderIndicators();
  }
}

async function ca_loadCountryData(country) {
  // Make sure the baked snapshot is available before we decide how to seed.
  if (!prebakedLoaded) await loadPrebakedIndicators();

  // Already resolved this session (baked or live) → done.
  const existing = countryDataCache[country];
  if (existing && !existing.__loading &&
      Object.keys(existing).filter(k => !k.startsWith('__')).length > 0) return;

  // 1) Seed instantly from the baked snapshot, if present.
  const baked = prebakedIndicators[country];
  const hasBaked = baked && Object.keys(baked).length > 0;
  if (hasBaked) {
    countryDataCache[country] = { ...baked, __source: 'baked' };
  } else {
    countryDataCache[country] = { __loading: true };
  }
  ca_rerenderIfOpen(country);

  // 2) Live background refresh — failures are silent; baked data is kept.
  const iso = ca_getIso(country);
  const allIds = new Set();
  for (const tab of CA_TABS) {
    for (const ind of CA_INDICATORS[tab] || []) {
      if (!ind.id.startsWith('__')) allIds.add(ind.id);
    }
  }

  const results = {};
  await Promise.all([...allIds].map(async id => {
    const res = await ca_fetchIndicator(iso, id);
    if (res) results[id] = res;
  }));

  if (Object.keys(results).length > 0) {
    // Live wins where present; keep baked values for anything the API dropped.
    countryDataCache[country] = { ...(baked || {}), ...results, __source: 'live' };
  } else if (!hasBaked) {
    // No live data and no baked data → mark done so the UI shows "—", not a spinner.
    countryDataCache[country] = { __loaded: true };
  }
  // else: live empty but baked present → keep the baked cache already set.

  ca_rerenderIfOpen(country);
}

function ca_formatValue(raw, ind) {
  if (!raw || raw.value === null || raw.value === undefined) return '—';
  const v = raw.value;
  switch (ind.fmt) {
    case 'pct1': return v.toFixed(1);
    case 'num0': return Number(v.toFixed(0)).toLocaleString();
    case 'num1': return v.toFixed(1);
    case 'num2': return v.toFixed(2);
    case 'big': {
      if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
      if (v >= 1e9)  return '$' + (v / 1e9).toFixed(1)  + 'B';
      if (v >= 1e6)  return '$' + (v / 1e6).toFixed(1)  + 'M';
      return '$' + Number(v.toFixed(0)).toLocaleString();
    }
    case 'pop': {
      if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
      return Number(v.toFixed(0)).toLocaleString();
    }
    default: return v.toFixed(1);
  }
}
